pluginGroup = io.github.yuriibondar
pluginName = claudestrator
pluginVersion = 0.1.8

# The oldest IDE the plugin supports (2026.2) and the platform it is compiled against. Only platform modules are
# used, so it runs in every IntelliJ-based IDE (WebStorm, IntelliJ IDEA, PyCharm, GoLand, ...).
# 2026.2 is the first with JCEF as a plugin of its own (com.intellij.modules.jcef); older IDEs have it in the core
# and do not know that id, so one build cannot serve both.
pluginSinceBuild = 262
platformVersion = 2026.2.3

# The IDE ships the Kotlin standard library; bundling another copy is a Marketplace review finding.
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
